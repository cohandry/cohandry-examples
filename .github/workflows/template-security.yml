name: Template security validation
# This workflow executes trusted base code only. Candidate templates are data.
# Never add secrets, publishing credentials, candidate commands or dependency installation.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Template format and risk checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate template data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          sparse-checkout: templates
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Test trusted validator
        working-directory: trusted
        run: node --max-old-space-size=128 --test --test-timeout=30000 tests/template-security.test.mjs
      - name: Validate candidate data without executing it
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATOR_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node --max-old-space-size=128 trusted/scripts/template-security/ci.mjs candidate template-security-report.json
      - name: Retain sanitized hash-bound report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-security-report
          path: template-security-report.json
          if-no-files-found: ignore
          retention-days: 30
